name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      # The runners have no ROCm: check the ROCm backend's Rust code without building csrc/.
      - name: Clippy with the rocm feature (check only)
        run: cargo +stable clippy --workspace --all-targets --features rocm --locked -- -D warnings
        env:
          HOMURA_ROCM_CHECK_ONLY: "1"
      - name: Panic locations (#[track_caller] on the public API)
        run: |
          python3 tools/check_track_caller.py --self-test
          python3 tools/check_track_caller.py
      # Host code of the ROCm layer against a stand-in HIP: needs a C++ compiler, not ROCm.
      - name: ROCm host failure paths
        run: python3 tools/check_rocm_host_failures.py
      - name: Debug tests
        run: cargo +stable test --workspace --locked
      - name: Release tests
        run: cargo +stable test --workspace --release --locked
      - name: Documentation
        run: cargo +stable doc --workspace --no-deps --locked
      - name: Documentation with the rocm feature (check only)
        run: cargo +stable doc --workspace --no-deps --features rocm --locked
        env:
          HOMURA_ROCM_CHECK_ONLY: "1"

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - name: Check
        run: cargo +1.88 check --workspace --all-targets --locked
      - name: Check with the rocm feature (check only)
        run: cargo +1.88 check --workspace --all-targets --features rocm --locked
        env:
          HOMURA_ROCM_CHECK_ONLY: "1"
