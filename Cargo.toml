[package]
name = "homura"
version = "0.1.0"
edition = "2024"
description = "A deep learning framework for AMD ROCm, written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TOBYYH/homura"
readme = "README.md"
keywords = ["deep-learning", "rocm", "amd", "gpu", "tensor"]
categories = ["science", "mathematics"]
exclude = ["/tools", "/tests/golden"]

[workspace]
members = ["homura-derive"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[dependencies]
half = "2.7"
