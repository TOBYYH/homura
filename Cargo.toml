[package]
name = "homura"
version = "0.1.1"
edition = "2024"
description = "A PyTorch-like tensor computing framework in Rust, built on hardware vendors' official toolchains"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TOBYYH/homura"
readme = "README.md"
keywords = ["deep-learning", "tensor", "pytorch", "gpu", "rocm"]
categories = ["science", "mathematics"]
exclude = ["/tools", "/tests"]

[workspace]
members = ["homura-derive"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[dependencies]
half = "2.7"
