[package]
name = "homura"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "A PyTorch-like tensor computing framework in Rust, built on hardware vendors' official toolchains"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TOBYYH/homura"
readme = "README.md"
keywords = ["deep-learning", "tensor", "pytorch", "gpu", "rocm"]
categories = ["science", "mathematics"]
exclude = ["/tools", "/tests"]

[workspace]
members = ["homura-derive", "homura-models"]

[workspace.package]
version = "0.4.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true

[dependencies]
half = "2.7"
homura-derive = { version = "=0.4.0", path = "homura-derive" }
memmap2 = "0.9.11"
