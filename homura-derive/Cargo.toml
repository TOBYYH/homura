[package]
name = "homura-derive"
version.workspace = true
edition = "2024"
rust-version.workspace = true
description = "Procedural macros for homura"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TOBYYH/homura"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["visit"] }

[dev-dependencies]
# The tests of the expansion check where errors point.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
